name: Monitor AMZX
on:
  push:
    branches: [main]
    paths:
      - monitor.py
      - watchdog.py
      - test_watchdog.py
      - push_delivery.py
      - push_sender.php
      - verify_push_crypto.php
      - test_push.py
      - config.json
      - test_monitor.py
      - test_improvements.py
      - .github/workflows/monitor.yml
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Enviar mensagem de teste ao Telegram
        type: boolean
        default: false
      test_push:
        description: Enviar teste de Web Push para os aparelhos cadastrados
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: amzx-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
      - name: Validar PHP do emissor de push
        run: php -l push_sender.php
      - name: Verificar criptografia Web Push
        run: php verify_push_crypto.php
      - name: Testar o monitor
        run: python3 -m unittest discover -v
      - name: Verificar site e enviar alertas
        id: monitor
        continue-on-error: true
        env:
          AMZX_WEBPUSH_CONFIG: ${{ secrets.AMZX_WEBPUSH_CONFIG }}
          SEND_PUSH_TEST: ${{ inputs.test_push || (github.event_name == 'push' && github.event.head_commit.message == 'Validar ativação e teste remoto do Web Push' && secrets.AMZX_WEBPUSH_CONFIG != '') }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SIMULATE_DOWN_ALERT: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Enviar teste de queda AMZX' }}
          SEND_TEST_ALERT: ${{ inputs.test_alert || (github.event_name == 'push' && (github.event.head_commit.message == 'Enviar resumo de teste AMZX' || github.event.head_commit.message == 'Enviar teste de queda AMZX')) }}
        run: python3 monitor.py
      - name: Conferir ativação do Android
        if: always() && steps.monitor.outcome != 'skipped'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('data/state.json')
          state = json.loads(path.read_text()) if path.exists() else {}
          meta = state.get('_monitor', {})
          count = len(meta.get('push_devices', []))
          queued = len(meta.get('push_queue', []))
          configured = bool(meta.get('push_configured'))
          text = ('## Ativação do Web Push\n\n'
                  + ('Configuração reconhecida: ' + str(count) + ' aparelho(s).\n' if configured else
                     'Nenhum aparelho reconhecido nesta execução. Abra o PWA no seu Android, permita notificações e cadastre a configuração no Secret AMZX_WEBPUSH_CONFIG.\n')
                  + '\nAlertas pendentes na fila: ' + str(queued) + '.\n'
                  + '\nEntrega no aparelho e som precisam ser confirmados pelo proprietário.\n')
          print(text)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a') as output:
                  output.write(text)
          PY
      - name: Salvar estado e histórico
        id: persist
        if: always() && steps.monitor.outcome != 'skipped'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar histórico do monitor'
            git push
          fi
      - name: Confirmar execução ao vigia externo
        if: always() && steps.persist.outcome == 'success'
        env:
          MONITOR_HEARTBEAT_URL: ${{ secrets.MONITOR_HEARTBEAT_URL }}
        run: python3 watchdog.py
      - name: Sinalizar indisponibilidade ou alerta pendente
        if: steps.monitor.outcome == 'failure'
        run: exit 1
# Revalidar cadastro do Android após salvar o Secret.

