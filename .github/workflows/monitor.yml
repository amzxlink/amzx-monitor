name: Monitor AMZX
on:
  push:
    branches: [main]
    paths:
      - monitor.py
      - config.json
      - test_monitor.py
      - test_improvements.py
      - .github/workflows/monitor.yml
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Enviar mensagem de teste ao Telegram
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: amzx-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
      - name: Testar o monitor
        run: python3 -m unittest discover -v
      - name: Verificar site e enviar alertas
        id: monitor
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST_ALERT: ${{ inputs.test_alert || (github.event_name == 'push' && github.event.head_commit.message == 'Enviar resumo de teste AMZX') }}
        run: python3 monitor.py
      - name: Salvar estado e histórico
        if: always() && steps.monitor.outcome != 'skipped'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar histórico do monitor'
            git push
          fi
      - name: Sinalizar indisponibilidade ou alerta pendente
        if: steps.monitor.outcome == 'failure'
        run: exit 1
